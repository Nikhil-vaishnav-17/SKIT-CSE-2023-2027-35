[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartkaksha-ml"
version = "0.1.0"
description = "SmartKaksha Face Detection, Recognition and Session Attendance Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SmartKaksha ML Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.16.0",
]
gpu = [
    "onnxruntime-gpu>=1.16.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
smartkaksha-ml = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
