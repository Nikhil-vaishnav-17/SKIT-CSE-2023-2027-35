# SmartKaksha ML Tunable Parameters
# Hyperparameters for face detection, quality filtering, enrollment, and matching

seed: 42

detection:
  input_size:
    - 640
    - 640
  score_threshold: 0.50
  nms_threshold: 0.40
  min_face_size: 24 # minimum face box dimension in pixels
  enable_tiling: true
  tile_size:
    - 640
    - 640
  tile_overlap: 0.20

alignment:
  target_size:
    - 112
    - 112
  min_blur_score: 50.0 # Laplacian variance threshold
  min_brightness: 40.0 # mean pixel intensity
  max_brightness: 220.0
  min_eye_distance: 14.0
  max_yaw_degrees: 35.0
  max_pitch_degrees: 30.0
  max_roll_degrees: 25.0

enrollment:
  required_photo_count: 5
  consistency_min: 0.45 # minimum cosine similarity across enrollment photos
  dedup_threshold: 0.60 # similarity threshold alerting admin to possible duplicate student

thresholds:
  threshold_version: "v0.1.0-baseline"
  model_version: "buffalo_l"
  preprocessing_version: "align1"
  accept_threshold: 0.40 # starting hypothesis; to be confirmed/tuned in Phase 5
  review_threshold: 0.32 # below this is unknown; between review and accept is uncertain
  margin_threshold: 0.08 # required difference between top-1 and top-2 candidates

