# SmartKaksha ML Configuration
# Structural and environment configuration

environment: "development"

paths:
  root_dir: "."
  data_dir: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  manifests_dir: "data/manifests"
  models_dir: "models"
  manifest_file: "models/MANIFEST"
  artifacts_dir: "artifacts"
  reports_dir: "reports"
  logs_dir: "logs"

models:
  pack_version: "buffalo_l"
  device: "cpu"
  intra_op_threads: 4
  inter_op_threads: 2
  detector:
    filename: "det_10g.onnx"
    model_name: "SCRFD-10GF"
    framework: "onnx"
    sha256: "5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91"
    role: "face_detection"
  recognizer:
    filename: "w600k_r50.onnx"
    model_name: "ArcFace-ResNet50"
    framework: "onnx"
    sha256: "4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43"
    role: "face_recognition"

store:
  backend: "file" # "file" in local dev, "qdrant" in service
  collection_name: "gallery__w600k_r50__align1"
  local_store_path: "artifacts/gallery_store.json"
  qdrant_host: "localhost"
  qdrant_port: 6333
  qdrant_api_key: ""
  qdrant_https: false

logging:
  level: "INFO"
  json_format: false # set true in FastAPI production container
  max_bytes: 10485760 # 10MB
  backup_count: 5

limits:
  max_photos_per_request: 3
  max_file_size_mb: 20
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
  max_concurrent_requests: 2

