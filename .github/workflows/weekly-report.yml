name: Weekly Progress Report

on:
  # 23:55 IST every Thursday = 18:25 UTC every Thursday.
  schedule:
    - cron: "25 18 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: python -m pip install --upgrade pip matplotlib reportlab

      - name: Generate one Thursday-to-Thursday report
        run: |
          python generate_report.py thursday
          mkdir -p weekly_reports
          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Generate weekly progress report"
            git push
          fi
